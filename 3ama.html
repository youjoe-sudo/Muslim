<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حفظ جزء عم</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background: #0b1220;
      color: #e6eef8;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      background: linear-gradient(135deg, #1abc9c, #16a085);
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      border-bottom: 4px solid #0b1220;
    }

    .container {
      max-width: 95%;
      margin: 20px auto;
      padding: 10px;
    }

    .sura {
      background: #1f4068;
      padding: 15px;
      border-radius: 12px;
      margin: 10px 0;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sura.done {
      background: #14532d;
      opacity: 0.9;
    }

    .sura h3 {
      margin: 0;
      font-size: 18px;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .buttons button {
      flex: 1 1 40%;
      min-width: 100px;
      background: #21e6c1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .buttons button:hover {
      background: #0be6a6;
    }

    .done-btn {
      background: #f39c12 !important;
      color: #fff;
    }

    .progress {
      margin: 25px auto;
      width: 95%;
      max-width: 600px;
      background: #1f4068;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 22px;
      width: 0%;
      background: #21e6c1;
      transition: width 0.5s ease-in-out;
    }

    p {
      text-align: center;
      font-size: 16px;
    }

    /* زر الانتقال */
    #nextPartBtn {
      display: none;
      margin: 20px auto;
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    #nextPartBtn:hover {
      background: #c0392b;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        font-size: 20px;
        padding: 15px;
      }

      .sura h3 {
        font-size: 16px;
      }

      .buttons button {
        flex: 1 1 45%;
        font-size: 13px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <header>📖 حفظ جزء عم</header>

  <div class="container" id="suraContainer"></div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <p>📊 نسبة الحفظ: <span id="progressText">0%</span></p>

  <!-- زرار يظهر بعد الحفظ -->
  <button id="nextPartBtn" onclick="window.location.href='tabarak.html'">
    🎉 اذهب إلى جزء تبارك
  </button>

  <script>
    const suras = [
      {name: "النبأ", file: "078.mp3"},
      {name: "النازعات", file: "079.mp3"},
      {name: "عبس", file: "080.mp3"},
      {name: "التكوير", file: "081.mp3"},
      {name: "الانفطار", file: "082.mp3"},
      {name: "المطففين", file: "083.mp3"},
      {name: "الانشقاق", file: "084.mp3"},
      {name: "البروج", file: "085.mp3"},
      {name: "الطارق", file: "086.mp3"},
      {name: "الأعلى", file: "087.mp3"},
      {name: "الغاشية", file: "088.mp3"},
      {name: "الفجر", file: "089.mp3"},
      {name: "البلد", file: "090.mp3"},
      {name: "الشمس", file: "091.mp3"},
      {name: "الليل", file: "092.mp3"},
      {name: "الضحى", file: "093.mp3"},
      {name: "الشرح", file: "094.mp3"},
      {name: "التين", file: "095.mp3"},
      {name: "العلق", file: "096.mp3"},
      {name: "القدر", file: "097.mp3"},
      {name: "البينة", file: "098.mp3"},
      {name: "الزلزلة", file: "099.mp3"},
      {name: "العاديات", file: "100.mp3"},
      {name: "القارعة", file: "101.mp3"},
      {name: "التكاثر", file: "102.mp3"},
      {name: "العصر", file: "103.mp3"},
      {name: "الهمزة", file: "104.mp3"},
      {name: "الفيل", file: "105.mp3"},
      {name: "قريش", file: "106.mp3"},
      {name: "الماعون", file: "107.mp3"},
      {name: "الكوثر", file: "108.mp3"},
      {name: "الكافرون", file: "109.mp3"},
      {name: "النصر", file: "110.mp3"},
      {name: "المسد", file: "111.mp3"},
      {name: "الإخلاص", file: "112.mp3"},
      {name: "الفلق", file: "113.mp3"},
      {name: "الناس", file: "114.mp3"}
    ];

    const container = document.getElementById("suraContainer");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const nextPartBtn = document.getElementById("nextPartBtn");

    // load saved progress
    let saved = JSON.parse(localStorage.getItem("savedSuras")) || [];

    // create sura blocks
    suras.forEach((sura, index) => {
      const div = document.createElement("div");
      div.className = "sura";
      if (saved.includes(index)) div.classList.add("done");
      div.innerHTML = `
        <h3>${sura.name}</h3>
        <div class="buttons">
          <button class="play-btn">▶️ تشغيل</button>
          <button class="pause-btn">⏸️ إيقاف مؤقت</button>
          <button class="stop-btn">⏹️ إيقاف كامل</button>
          <button class="repeat-btn">🔁 تكرار</button>
          <button class="done-btn">✅ تم الحفظ</button>
        </div>
      `;
      container.appendChild(div);

      const audio = new Audio(`https://server8.mp3quran.net/afs/${sura.file}`);
      let isLooping = false;

      div.querySelector(".play-btn").addEventListener("click", () => {
        audio.loop = isLooping;
        audio.play();
      });

      div.querySelector(".pause-btn").addEventListener("click", () => {
        audio.pause();
      });

      div.querySelector(".stop-btn").addEventListener("click", () => {
        audio.pause();
        audio.currentTime = 0;
      });

      div.querySelector(".repeat-btn").addEventListener("click", () => {
        isLooping = !isLooping;
        audio.loop = isLooping;
        alert(isLooping ? "🔁 التكرار مفعل" : "⏹️ التكرار متوقف");
      });

      div.querySelector(".done-btn").addEventListener("click", () => {
        if (!saved.includes(index)) {
          saved.push(index);
          localStorage.setItem("savedSuras", JSON.stringify(saved));
          div.classList.add("done");
          updateProgress();
          checkAllSaved();
        }
      });
    });

    function checkAllSaved() {
      if (saved.length === suras.length) {
        nextPartBtn.style.display = "block"; // ✅ يظهر الزرار بدل التحويل المباشر
      }
    }

    function updateProgress() {
      let percent = Math.round((saved.length / suras.length) * 100);
      progressBar.style.width = percent + "%";
      progressText.textContent = percent + "%";
    }

    updateProgress();
    checkAllSaved(); // في حالة كان كله متعلم قبل كده
  </script>
</body>
</html>
